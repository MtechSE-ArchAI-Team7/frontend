[project]
name = "aios-frontend-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.62",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["agent3/backend", "agent4/backend"]
addopts = "--import-mode=importlib"
