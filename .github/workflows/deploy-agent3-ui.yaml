name: Deploy Agent 3 UI

on:
  workflow_dispatch:
    inputs:
      agent2-api-url:
        description: Public Agent 2 log gateway base URL without a trailing slash.
        required: true
        type: string
        default: https://sz3tbpu564gwikyhk2j3f7jn6y0vsusz.lambda-url.ap-southeast-1.on.aws
      agent4-api-url:
        description: Public Agent 4 receiver base URL, or the explicitly accepted local fallback.
        required: true
        type: string
        default: http://localhost:8000

permissions:
  contents: read
  id-token: write

concurrency:
  group: aios-remediation-demo-ui-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_AGENT2_API: ${{ inputs.agent2-api-url }}
      VITE_AGENT4_API: ${{ inputs.agent4-api-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release inputs
        shell: bash
        env:
          AWS_UI_DEPLOY_ROLE_ARN: ${{ secrets.AWS_UI_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_UI_DEPLOY_ROLE_ARN" ]]; then
            echo "The repository is missing AWS_UI_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi
          if [[ "$VITE_AGENT2_API" != "https://sz3tbpu564gwikyhk2j3f7jn6y0vsusz.lambda-url.ap-southeast-1.on.aws" ]]; then
            echo "The Agent 2 gateway URL does not match the approved production endpoint." >&2
            exit 1
          fi
          if [[ "$VITE_AGENT4_API" != "http://localhost:8000" && ! "$VITE_AGENT4_API" =~ ^https://[^/]+$ ]]; then
            echo "The Agent 4 receiver must be the accepted local fallback or an HTTPS origin without a path." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Validate and build release
        run: make check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_UI_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy existing Lambda code package
        run: bash scripts/deploy_agent3_ui.sh
